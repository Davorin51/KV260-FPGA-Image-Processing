[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "kv260-image-processing"
version = "0.1.0"
description = "Original classical image processing: bit-exact grayscale and KV260 HLS integration foundation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.4", "Pillow>=10,<14"]
license = "MIT"
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "build>=1,<2"]
[project.scripts]
kv260-image = "kv260_image.cli:main"
[tool.setuptools.packages.find]
where = ["host/python"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.coverage.run]
source = ["kv260_image"]
[tool.coverage.report]
show_missing = true
